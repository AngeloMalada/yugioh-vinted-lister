name: Build & release

# Runs only when a branch named release/<version> is created, e.g. release/1.2.0
# (release.ps1 does this). Builds the Windows installer and publishes GitHub Release v1.2.0;
# installed apps then offer "Update & restart".
on:
  create:

permissions:
  contents: write

jobs:
  build:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from branch name
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".Substring("release/".Length).TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Branch must be release/<major.minor.patch>, e.g. release/1.2.0 (got '${{ github.ref_name }}')" }
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "v$v is already released - create release/<next version> instead" }
          $global:LASTEXITCODE = 0
          (Get-Content version.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content version.py
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building v$v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app and installer
        shell: pwsh
        run: .\build.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" installer\YugiohVintedLister-Setup.exe --target "${{ github.sha }}" --title "v$v" --generate-notes
